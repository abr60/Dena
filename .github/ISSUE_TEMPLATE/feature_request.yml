name: Feature request
description: Suggest an idea for Dena
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an idea! Tell us what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your feature request related to a problem? Describe it.
      placeholder: I'm always frustrated when ...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should Dena do?
      placeholder: It would be great if Dena could ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other way you thought about solving this?
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots, mockups, or examples.
    validations:
      required: false
